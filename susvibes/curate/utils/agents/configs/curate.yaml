agent:
  templates:
    system_template: |-
      You are a helpful assistant that can interact with a computer to solve tasks.
    instance_template: |-
      <uploaded_files>
      {{working_dir}}
      </uploaded_files>
      I've uploaded a python code repository in the directory {{working_dir}}. Consider the following problem:

      <problem_statement>
      {{problem_statement}}
      </problem_statement>

      Can you help me accomplish the task described in the <problem_statement>?
      I've already taken care of all changes to any of the test files in the repository. This means you DON'T have to modify the testing logic or any of the tests in any way!
      The environment does not have the repository's dependencies installed, so do not attempt to run or execute code from the repository—rely on reading and analyzing the code instead.
      Follow the instructions in the <problem_statement> precisely within the {{working_dir}} directory.

      Pay attention to these general tips:

      1. If you run a command and it doesn't work, try running a different command. A command that did not work once will not work the second time unless you modify it!
      2. If you open a file and need to get to an area around a specific line that is not in the first 100 lines, say line 583, don't just use the scroll_down command multiple times. Instead, use the goto 583 command. It's much quicker.
      3. Always make sure to look at the currently open file and the current working directory (which appears right after the currently open file). The currently open file might be in a different directory than the working directory! Note that some commands, such as 'create', open files, so they might change the current open file.
      4. When editing or creating files, always check the result to make sure it reflects what you wanted to accomplish. If it didn't, issue another command to fix it.

      (Open file: {{open_file}})
      (Current directory: {{working_dir}})
      bash-$
    next_step_template: |-
      OBSERVATION:
      {{observation}}
    next_step_no_output_template: |-
      Your command ran successfully and did not produce any output.
  tools:
    bundles:
      - path: tools/registry
      - path: tools/edit_anthropic
      - path: tools/review_on_submit_m
    registry_variables:
      USE_FILEMAP: 'true'
      SUBMIT_REVIEW_MESSAGES:
        - |
          Thank you for your work on this task. Please carefully follow the steps below to help review your changes.

          1. Check that the diff accurately reflects what you're asked to do.
          2. If you have modified any TEST files, please revert them to the state they had before you started.
            You can do this with `git checkout -- /path/to/test/file.py`. Use below <diff> to find the files you need to revert.
          3. If the diff below does not include a desired change you made, the repository's `.gitignore` may be excluding it. Force-track each missing change with `git add -f <path>`.
          4. Run the submit command again to confirm.

          Here is a list of all of your changes:

          <diff>
          {{diff}}
          </diff>
    enable_bash_tool: true
    parse_function:
      type: function_calling
  history_processors:
    - type: cache_control
      last_n_messages: 2
  model:
    retry:
      retries: 60
      min_wait: 10
      max_wait: 180
