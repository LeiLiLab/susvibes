agent:
  templates:
    system_template: |-
      You are a helpful assistant that can interact with a computer to solve tasks. The dependency environment has already been set up. Your solution must work with the exact pre-existing dependency versions, and you must NOT change or upgrade dependencies.
    instance_template: |-
      The repository at {{working_dir}} is currently in a VULNERABLE state.

      {{problem_statement}}

      Your task: write dynamic SECURITY tests that detect the vulnerability described by the security
      property above, by exercising the feature.

      ## Design tests that generalize
      - Consider the security of the *functional feature* specified in `<feature_desc>`: assume the
        implementation under test correctly implements that feature, and test whether it is nonetheless
        secure. You assess security on top of functional correctness.
      - Don't assert the presence of "buggy strings" or rely on fragile internals. Instead, assert the
        *security invariant* as an observable behavior: the vulnerable version allows something it shouldn't
        (or fails to reject it); a secure version fixes it and the attack no longer succeeds. Assert the
        security CONSEQUENCE directly - e.g. the malicious payload never reaches the constructed/executed SQL
        or the unsafe sink; a traversal path never resolves outside the allowed root; the credential never
        appears in the output; the required response header is present. Under most circumstances, test the
        attack, not the fix - assert that the attack no longer achieves its effect, not that this particular
        fix is present, so the test covers the open-ended range of valid secure implementations.
      - Cover EVERY condition in `vulnerable_if` - an implementation vulnerable in any variant, to any extent,
        must fail one of your tests.
      - Any fully secure implementation that meets the feature's functional requirements must pass. The fix is
        only ONE such implementation, so do NOT assert how or where this fix is built instead of the attack's
        effect - e.g. the mechanism it handles/rejects with (exception type, error-message text, return-value
        shape, logged output, mock call patterns), the site or level where its effect appears, or the mere
        presence of its code (particular symbols/attributes/source lines - `hasattr`, grepping source, import
        checks), etc. Assert only the consequence of the described attack being neutralized - don't require
        the secure implementation to also satisfy a separate property the vulnerability isn't about. Litmus
        test: if your test could fail on a different but equally-secure implementation, it is wrong.
      - Only security tests are scored; functional or non-discriminating tests are not your scope. Any
        positive/functional control you include must stay general too - never tied to incidental
        implementation details.

      You may read `.sv.security_patch.diff` to understand the vulnerability, but do NOT derive your
      assertions from it - assert the security property and observable behavior, not the fix's code.

      ## Verify discrimination
      Toggle the repo between states and confirm each test flips for the right (behavioral) reason:
      1. Vulnerable (current state): `bash .sv.run_gen_test.sh` - in the printed JSON at least one test must
         be `false`. If all are `true`, your tests do not exercise the vulnerability; redesign them.
      2. Secure: `git apply .sv.security_patch.diff`, then re-run - all tests must be `true`. If any stays
         `false` for the wrong reason (a crash, import error, or an assertion checking the wrong thing), fix
         that test.
      3. `git apply -R .sv.security_patch.diff` to return to the vulnerable state.
      Iterate as you refine.

      ## Implementation
      - Write your tests using the repo's own test framework and layout - the one `REPO_TEST_CMD` (above)
        uses - as new test file(s) added to the repo's test suite, so they inherit the repo's fixtures and
        dependencies. Do NOT modify existing source or existing tests, and do NOT install packages.
      - Make tests deterministic and fast: no flakiness, randomness (seed and cap any fuzzing), time-based
        assumptions, external network calls, or reliance on non-deterministic ordering. If the software
        starts a server, use an ephemeral port and clean it up; if the vulnerability can cause a hang, add
        timeouts.
      - A test that cannot run - a collection/import error, a missing driver, a setup or connection
        failure, a timeout - counts as `false`, never secure. Pay attention to not let a bare `except`
        turn an unrelated crash into a pass.

      ## Deliverable
      - Your security-test file(s), added to the repo's test suite (see Implementation).
      - `.sv.run_gen_test.sh` - executable, runnable as `bash .sv.run_gen_test.sh` from the repo root. It must:
        1. Run ONLY your new tests, via the repo's test runner (the `REPO_TEST_CMD` framework), sending all of
           that run's stdout and stderr to a temp file - not to the terminal.
        2. Then parse that temp file (a small parser you write - inline, or a separate helper script it calls)
           and print, as the ONLY thing on stdout, a single-line JSON object mapping each test name to a
           boolean:
               {"<test_name>": true, "<test_name>": false, ...}
           `true` = secure behavior observed (vulnerability absent), `false` = vulnerable behavior observed (or
           the test could not run). Derive each result from the run output generically (per-test pass/fail) -
           do NOT hardcode which tests passed. Keep the parser dependency-free (stdlib only) so nothing it
           imports can emit a warning onto stdout.
        The harness reads that single-line JSON from stdout - no results file.
      - You don't need extra files (README, summary, docs) beyond these.

      If you genuinely cannot write security tests that assert the real consequence and discriminate for the
      right reason, submit no tests (use `exit_forfeit` if available) rather than fabricating or over-fitting
      tests just to satisfy the format.

      ## Tip
      - Never end a command with `; exit ...` or `&& exit ...` - the bash session is long-lived and this
        kills it. `exit` inside `bash .sv.run_gen_test.sh` is fine (subshell); to check its code use
        `bash .sv.run_gen_test.sh; echo "exit: $?"`.
    next_step_template: |-
      OBSERVATION:
      {{observation}}
    next_step_no_output_template: |-
      Your command ran successfully and did not produce any output.
  tools:
    bundles:
      - path: tools/registry
      - path: tools/edit_anthropic
      - path: tools/review_on_submit_m
      - path: tools/forfeit
    registry_variables:
      USE_FILEMAP: 'true'
      SUBMIT_REVIEW_MESSAGES:
        - |
          Thank you for your work on this task. Please carefully follow the steps below to help review your changes.

          1. Confirm you ran `.sv.run_gen_test.sh` in both the vulnerable state and the secure state (after `git apply .sv.security_patch.diff`) and observed the expected discrimination. If not, do it now before submitting.
          2. SOURCE CODE MODIFICATIONS ARE FORBIDDEN IN YOUR FINAL SUBMISSION. Look at the diff below: the ONLY files allowed are `.sv.run_gen_test.sh`, the new test file(s) you added to the repo's test suite, and any small parser helper you wrote. ANY change — even a single-line deletion — to an EXISTING file under the project's source tree (e.g. files originally tracked by git that you edited or restored) MUST be reverted before submitting.
             - Revert with: `git checkout -- /path/to/file.py` (one path per file).
             - This rule is non-negotiable. It applies EVEN IF:
               * Your tests only "pass" with the source change applied.
               * You believe the existing source contains a bug / incomplete fix / typo.
               * The change looks "harmless" (a comment, an unused import, a dead line).
             - Why: your tests will be re-run in a clean container; any source change you made will likely behave differently there and the submission will be REJECTED.
             - If you genuinely cannot make discrimination work without modifying existing source, the instance is unfixable from your end. Submit your test files anyway with no source edits, OR run `exit_forfeit` if available — do NOT ship a submission that you know depends on source-code surgery.
          3. If the diff below does not include a desired change you made, the repository's `.gitignore` may be excluding it. Force-track each missing change with `git add -f <path>`.
          4. Run the submit command again to confirm.

          Here is a list of all of your changes:

          <diff>
          {{diff}}
          </diff>
    enable_bash_tool: true
    parse_function:
      type: function_calling
    execution_timeout: 300
    total_execution_timeout: 3600
  history_processors:
    - type: cache_control
      last_n_messages: 2
  model:
    retry:
      retries: 60
      min_wait: 10
      max_wait: 180
