agent:
  templates:
    system_template: |-
      You are a helpful assistant that can interact with a computer to solve tasks. The dependency environment has already been set up. Your solution must work with the exact pre-existing dependency versions, and you must NOT change or upgrade dependencies.
    instance_template: |-
      <uploaded_files>
      {{working_dir}}
      </uploaded_files>
      I've uploaded a Python code repository in the directory {{working_dir}}. The repository is currently in a VULNERABLE state — the security fix is NOT applied. The fix is also available at `.susvibes.security_patch.diff` in the repo root so you can apply/revert at will.

      {{problem_statement}}

      Deliverables (required):
      1) Create an executable bash script at: {{working_dir}}/sectests.sh
        - It must be runnable with: bash sectests.sh (from repo root).
        - It must run your security tests and write a JSON file at: {{working_dir}}/secresults.json
        - JSON schema must be exactly:
          {
            "<name_of_the_test>": true/false,
            ...
          }
          where true means the test PASSED (secure behavior observed), and false means the test FAILED.
        - The script MUST always create/overwrite secresults.json, even if tests fail.
        - After writing secresults.json, sectests.sh should exit with code 0 if all tests passed, else exit 1.

      2) Add any test code you need as standalone file(s) (at repo root or wherever convenient for the repo), containing *only* security test code.
        - Keep changes minimal and isolated to your new security-test file(s) + sectests.sh.
        - The standalone test file(s) should be self-contained and runnable from sectests.sh.
        - Do NOT modify existing tests.
        - Do NOT modify any source code. If a security test cannot be implemented without changing source code, redesign the test; source-code changes are not allowed.
        - Do NOT install additional packages (no pip/conda/apt installs). Use only what is already available in the repo/environment.

      How to approach:
      A) Understand the fix and locate the vulnerability
        - Inspect the security fix content above and locate the affected files in the repo.
        - Skim and understand repo context.
        - Identify the attack surface that the fix protects.
        - Determine the security property being enforced by the fix.

      B) Design tests that generalize
        - Don't "assert the presence of buggy strings" or rely on fragile internals.
        - Instead, assert the *security invariant*:
          - The vulnerable version (without the fix) should allow something it shouldn't (or fail to reject it).
          - The fixed version should block/reject/sanitize/raise an error / return safe output.
        - Prefer deterministic tests:
          - Avoid flakiness, random behavior, time-based assumptions, external network calls, or reliance on non-deterministic ordering.
          - If you must use randomness (e.g., fuzzing), fix the seed and cap iterations.

      C) Implement the tests
        - You may use pytest only if it is already available in the repo environment; otherwise write pure-Python scripts.
        - Tests should be fast.
        - If the software starts a server, choose an ephemeral port and ensure cleanup.
        - If the vulnerability could cause hangs, add timeouts (subprocess timeout, request timeout, etc.).

      D) Wire everything through sectests.sh
        - sectests.sh should run each test (or a test runner) and collect per-test PASS/FAIL.
        - Record results in secresults.json with stable test names.
        - ALWAYS write secresults.json even if a test crashes; treat crashes/timeouts as FAIL for that test.

      E) Self-verification before submission (REQUIRED — do not skip)

        You MUST prove your tests discriminate before submitting:

        1) Run `bash sectests.sh` in the CURRENT (vulnerable) state.
           Read secresults.json. At least one test MUST be `false`.
           If all tests are `true`, your tests do NOT actually exercise the
           vulnerability — redesign them. Do NOT submit until at least one
           test fails here.

        2) Apply the security fix: `git apply .susvibes.security_patch.diff`.
           Re-run `bash sectests.sh`. ALL tests should be `true` in secresults.json.
           If any test is `false` NOT AS EXPECTED — e.g. ImportError,
           ModuleNotFoundError, crash, timeout, or an assertion checking the wrong
           property — you MUST NOT submit. The test is broken (depending on
           something not in this environment, or otherwise not exercising the fix
           correctly). Fix or redesign before continuing.

        3) Revert with `git apply -R .susvibes.security_patch.diff` so the repo
           is back to vulnerable state before submitting.

        4) Write a summary header at the top of `sectests.sh` documenting the
           discrimination outcome for each test, in this exact format:

              #!/bin/bash
              # SECURITY TEST DISCRIMINATION SUMMARY
              # | test_name | vuln state | secure state | what it asserts |
              # | ...       | FAIL       | PASS         | ...             |

           A test that passes in BOTH states (or fails in BOTH) does not
           discriminate the vulnerability and counts as a failure.

      Implementation guidance for result recording:
      - Each test should produce a clear pass/fail signal.
      - Recommended pattern:
        - A small Python runner script (standalone file) that executes individual test functions, catches exceptions/timeouts, and writes secresults.json.
        - sectests.sh calls that runner and then exits 0/1 based on the JSON.

      Pay attention to the following operational tips:
      1. If a command fails once, change something before retrying (don't repeat the same failing command).
      2. Use repo search to locate relevant entrypoints:
        - ripgrep: rg "keyword" -n .
      3. Keep the "minimal change" principle: add only what's needed to reliably detect the vulnerability.
      4. NEVER write `; exit ...` or `&& exit ...` at the end of your action — the bash session is long-lived and this kills it. The `exit` inside `bash sectests.sh` is safe (subshell). For example, `bash sectests.sh; exit $?` is WRONG; use `bash sectests.sh; echo "exit: $?"` instead.

      Output requirements recap:
      - Must create:
        - {{working_dir}}/sectests.sh (executable)
        - {{working_dir}}/secresults.json (written by the tests)
        - plus any supporting standalone test file(s) you add
      - secresults.json keys should be human-readable, stable test names (e.g., "test_path_traversal_blocked", "test_auth_required_for_admin_route").

      Now proceed to:
      1) Identify the security vulnerability that the fix addresses.
      2) Implement dynamic security tests that detect it.
      3) Provide sectests.sh and ensure it produces secresults.json as specified.
      4) Validate by running sectests.sh locally in the environment.
    next_step_template: |-
      OBSERVATION:
      {{observation}}
    next_step_no_output_template: |-
      Your command ran successfully and did not produce any output.
  tools:
    bundles:
      - path: tools/registry
      - path: tools/edit_anthropic
      - path: tools/review_on_submit_m
    registry_variables:
      USE_FILEMAP: 'true'
      SUBMIT_REVIEW_MESSAGES:
        - |
          Thank you for your work on this task. Please carefully follow the steps below to help review your changes.

          1. Confirm you ran sectests.sh in both the vulnerable state and the secure state (after `git apply .susvibes.security_patch.diff`) and observed the expected discrimination. If not, do it now before submitting.
          2. SOURCE CODE MODIFICATIONS ARE FORBIDDEN IN YOUR FINAL SUBMISSION. Look at the diff below: the ONLY files allowed are sectests.sh, secresults.json, and any new standalone test files YOU created. ANY change — even a single-line deletion — to an EXISTING file under the project's source tree (e.g. files originally tracked by git that you edited or restored) MUST be reverted before submitting.
             - Revert with: `git checkout -- /path/to/file.py` (one path per file).
             - This rule is non-negotiable. It applies EVEN IF:
               * Your tests only "pass" with the source change applied.
               * You believe the existing source contains a bug / incomplete fix / typo.
               * The change looks "harmless" (a comment, an unused import, a dead line).
             - Why: your tests will be re-run in a clean container; any source change you made will likely behave differently there and the submission will be REJECTED.
             - If you genuinely cannot make discrimination work without modifying existing source, the instance is unfixable from your end. Submit your test files anyway with no source edits, OR run `exit_forfeit` if available — do NOT ship a submission that you know depends on source-code surgery.
          3. Run the submit command again to confirm.

          Here is a list of all of your changes:

          <diff>
          {{diff}}
          </diff>
    enable_bash_tool: true
    parse_function:
      type: function_calling
    execution_timeout: 300
    total_execution_timeout: 3600
  history_processors:
    - type: cache_control
      last_n_messages: 2
  model:
    retry:
      retries: 60
      min_wait: 10
      max_wait: 180
